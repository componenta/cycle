name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, ctype
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
      - name: Recheck all hot-path benchmarks against the last performance baseline
        if: matrix.php == '8.5'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cycle-before"
          git archive 3db46076af22101df6fbf3fe0ef1445b39796929 src | tar -x -C "$RUNNER_TEMP/cycle-before"
          for scenario in data-fetcher orm-hydration; do
            echo "Before: $scenario"
            CYCLE_BENCH_SOURCE_ROOT="$RUNNER_TEMP/cycle-before/src" php "benchmarks/$scenario.php"
            echo "After: $scenario"
            php "benchmarks/$scenario.php"
          done
      - name: Checkout the Cycle App consumer
        if: matrix.php == '8.5'
        uses: actions/checkout@v7
        with:
          repository: componenta/cycle-app
          ref: 82fd91331c3005640891b4e541daa557097b621c
          path: _integration/cycle-app
          persist-credentials: false
      - name: Test Cycle App against the audited source tree
        if: matrix.php == '8.5'
        working-directory: _integration/cycle-app
        shell: bash
        run: |
          set -euo pipefail
          composer config --json repositories.cycle-audit "{\"type\":\"path\",\"url\":\"$GITHUB_WORKSPACE\",\"options\":{\"symlink\":true,\"versions\":{\"componenta/cycle\":\"1.1.1\"}}}"
          composer update --prefer-dist --no-interaction
          composer show componenta/cycle
          test "$(realpath vendor/componenta/cycle)" = "$GITHUB_WORKSPACE"
          composer test

  lowest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, ctype
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
      - run: composer show --direct
      - run: composer test -- --display-deprecations --display-phpunit-deprecations --fail-on-deprecation --fail-on-phpunit-deprecation

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: cycle_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_mysql, mbstring, ctype
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
        env:
          CYCLE_TEST_DB_DRIVER: mysql
          CYCLE_TEST_DB_NAME: cycle_tests
          CYCLE_TEST_DB_HOST: 127.0.0.1
          CYCLE_TEST_DB_PORT: '3306'
          CYCLE_TEST_DB_USER: root
          CYCLE_TEST_DB_PASSWORD: test-password

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cycle
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: cycle_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cycle -d cycle_tests"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_pgsql, mbstring, ctype
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
        env:
          CYCLE_TEST_DB_DRIVER: postgres
          CYCLE_TEST_DB_NAME: cycle_tests
          CYCLE_TEST_DB_HOST: 127.0.0.1
          CYCLE_TEST_DB_PORT: '5432'
          CYCLE_TEST_DB_USER: cycle
          CYCLE_TEST_DB_PASSWORD: test-password
          CYCLE_TEST_DB_SCHEMA: public

  sqlserver:
    runs-on: ubuntu-24.04
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: CycleTest-2026!
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_sqlsrv, mbstring, ctype
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Install Microsoft ODBC Driver 18
        shell: bash
        run: |
          set -euo pipefail
          if ! dpkg-query -W -f='${Status}' msodbcsql18 2>/dev/null | grep -q 'install ok installed'; then
            if ! dpkg-query -W -f='${Status}' packages-microsoft-prod 2>/dev/null | grep -q 'install ok installed'; then
              curl --fail --silent --show-error --location https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -o "$RUNNER_TEMP/packages-microsoft-prod.deb"
              sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
            fi
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi
          odbcinst -q -d
      - name: Wait for SQL Server
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if php -r 'new PDO("sqlsrv:Server=127.0.0.1,1433;Database=master;TrustServerCertificate=1;LoginTimeout=3", "sa", getenv("CYCLE_TEST_DB_PASSWORD"));'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
        env:
          CYCLE_TEST_DB_PASSWORD: CycleTest-2026!
      - name: Run the complete suite with SQL Server integration
        run: composer test
        env:
          CYCLE_TEST_DB_DRIVER: sqlserver
          CYCLE_TEST_DB_NAME: master
          CYCLE_TEST_DB_HOST: 127.0.0.1
          CYCLE_TEST_DB_PORT: '1433'
          CYCLE_TEST_DB_USER: sa
          CYCLE_TEST_DB_PASSWORD: CycleTest-2026!
          CYCLE_TEST_DB_TRUST_SERVER_CERTIFICATE: 'true'
