name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, ctype
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test

  lowest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, ctype
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
      - run: composer show --direct
      - run: composer test -- --display-deprecations --display-phpunit-deprecations --fail-on-deprecation --fail-on-phpunit-deprecation

  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.5'
            dependencies: latest
          - php: '8.4'
            dependencies: lowest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: cycle_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, mbstring, ctype
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
        if: matrix.dependencies == 'latest'
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
        if: matrix.dependencies == 'lowest'
      - run: composer show --direct
      - run: composer test
        env:
          CYCLE_TEST_DB_DRIVER: mysql
          CYCLE_TEST_DB_NAME: cycle_tests
          CYCLE_TEST_DB_HOST: 127.0.0.1
          CYCLE_TEST_DB_PORT: '3306'
          CYCLE_TEST_DB_USER: root
          CYCLE_TEST_DB_PASSWORD: test-password

  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.5'
            dependencies: latest
          - php: '8.4'
            dependencies: lowest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cycle
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: cycle_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cycle -d cycle_tests"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_pgsql, mbstring, ctype
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
        if: matrix.dependencies == 'latest'
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
        if: matrix.dependencies == 'lowest'
      - run: composer show --direct
      - run: composer test
        env:
          CYCLE_TEST_DB_DRIVER: postgres
          CYCLE_TEST_DB_NAME: cycle_tests
          CYCLE_TEST_DB_HOST: 127.0.0.1
          CYCLE_TEST_DB_PORT: '5432'
          CYCLE_TEST_DB_USER: cycle
          CYCLE_TEST_DB_PASSWORD: test-password
          CYCLE_TEST_DB_SCHEMA: public

  sqlserver:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            dependencies: latest
          - php: '8.4'
            dependencies: lowest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: CycleTest-2026!
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_sqlsrv, mbstring, ctype
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
        if: matrix.dependencies == 'latest'
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
        if: matrix.dependencies == 'lowest'
      - run: composer show --direct
      - name: Install Microsoft ODBC Driver 18
        shell: bash
        run: |
          set -euo pipefail
          if ! dpkg-query -W -f='${Status}' msodbcsql18 2>/dev/null | grep -q 'install ok installed'; then
            if ! dpkg-query -W -f='${Status}' packages-microsoft-prod 2>/dev/null | grep -q 'install ok installed'; then
              curl --fail --silent --show-error --location https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -o "$RUNNER_TEMP/packages-microsoft-prod.deb"
              sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
            fi
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi
          odbcinst -q -d
      - name: Wait for SQL Server
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if php -r 'new PDO("sqlsrv:Server=127.0.0.1,1433;Database=master;TrustServerCertificate=1;LoginTimeout=3", "sa", getenv("CYCLE_TEST_DB_PASSWORD"));'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
        env:
          CYCLE_TEST_DB_PASSWORD: CycleTest-2026!
      - name: Run the complete suite with SQL Server integration
        run: composer test
        env:
          CYCLE_TEST_DB_DRIVER: sqlserver
          CYCLE_TEST_DB_NAME: master
          CYCLE_TEST_DB_HOST: 127.0.0.1
          CYCLE_TEST_DB_PORT: '1433'
          CYCLE_TEST_DB_USER: sa
          CYCLE_TEST_DB_PASSWORD: CycleTest-2026!
          CYCLE_TEST_DB_TRUST_SERVER_CERTIFICATE: 'true'

  next-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring, ctype
          coverage: none
          tools: composer:v2
      # Test the exact coordinated dependency sources before their releases.
      # These path repositories and aliases exist only in this CI workspace.
      - uses: actions/checkout@v7
        with:
          repository: componenta/di
          ref: e203077d12048936f078d37d1cf3badd661e1716
          path: .ci/di
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: componenta/identity
          ref: 3feb94e0d64956ecdf7b22abed4a8bd9f597abeb
          path: .ci/identity
          persist-credentials: false
      - name: Resolve the next dependency combination
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          $path = 'composer.json';
          $manifest = json_decode(file_get_contents($path), true, flags: JSON_THROW_ON_ERROR);
          $manifest['repositories'] = [
              ['type' => 'path', 'url' => '.ci/di', 'options' => [
                  'versions' => ['componenta/di' => '6.0.0'], 'symlink' => false,
              ]],
              ['type' => 'path', 'url' => '.ci/identity', 'options' => [
                  'versions' => ['componenta/identity' => '1.1.1'], 'symlink' => false,
              ]],
          ];
          $manifest['require']['componenta/config'] = '^4.0';
          $manifest['require']['componenta/di'] = '^6.0';
          $manifest['require']['componenta/identity'] = '^1.1.1';
          file_put_contents($path, json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          PHP
          composer update --no-interaction --prefer-dist
          composer show --direct
      - run: composer test

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
    needs: [sqlite, lowest-dependencies, mysql, postgres, sqlserver, next-dependencies]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          first_line="${COMMIT_MESSAGE%%$'\n'*}"
          tag="${first_line#Release }"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
